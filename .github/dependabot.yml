# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
# cooldown: wait a week after a release before proposing it, so a compromised
# or quickly-yanked version is less likely to be picked up.
updates:
  # GitHub Actions dependencies (grouped into single PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # Docker base images (grouped into single PR)
  # Every directory containing a Dockerfile must be listed explicitly:
  # Dependabot does not search subdirectories.
  #
  # docker/Dockerfile takes its Apache ZooKeeper base image from the
  # BASE_IMAGE build arg (built from docker/zookeeper-image in the same
  # release job), so there is no base image tag for Dependabot to bump there.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/build"
      - "/docker"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-dependencies:
        patterns:
          - "*"

  # The ZooKeeper server version comes from the Gradle variable below.
  # This entry updates only the Debian base image.
  - package-ecosystem: "docker"
    directory: "/docker/zookeeper-image"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      zookeeper-image-dependencies:
        patterns:
          - "*"

  # Gradle dependencies for the "zu" helper tool. The ZooKeeper dependency
  # uses zookeeperVersion in build.gradle.kts, shared with server-image builds.
  - package-ecosystem: "gradle"
    directory: "/docker/zu"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      zookeeper:
        patterns:
          - "org.apache.zookeeper:*"
      gradle-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "org.apache.zookeeper:*"


  # =============================================================================
  # GO MODULES CONFIGURATION WITH GROUPING
  # =============================================================================
  # Grouping combines all Go module updates into a single PR.
  # Groups apply per package-ecosystem entry.
  #
  # Current go.mod files detected:
  # - / (root)
  # =============================================================================

  # Main Go modules (grouped into single PR)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      main-go-dependencies:
        patterns:
          - "*"
