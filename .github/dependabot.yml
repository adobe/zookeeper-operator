# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # GitHub Actions dependencies (grouped into single PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # Docker base images (grouped into single PR)
  # Every directory containing a Dockerfile must be listed explicitly:
  # Dependabot does not search subdirectories.
  #
  # The adobe/zookeeper base image in docker/Dockerfile is deliberately NOT
  # ignored here. It is pinned to the floating "<zk version>-apache" tag that
  # the build-zookeeper-apache release job publishes, so the only candidates
  # Dependabot can resolve are images this repository built from ARG ZK_VERSION
  # in docker/zookeeper-image/Dockerfile. Letting Dependabot raise that bump
  # automates the step that re-synchronises docker/Dockerfile with a new
  # ARG ZK_VERSION after the ZooKeeper image has been released.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/build"
      - "/docker"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-dependencies:
        patterns:
          - "*"

  # The Apache ZooKeeper server version itself is managed manually. It is the
  # tarball downloaded by ARG ZK_VERSION in docker/zookeeper-image/Dockerfile,
  # which Dependabot cannot see, and bumping it requires a coordinated release:
  # bump ARG ZK_VERSION, push a zk<date> tag to publish the base image, let
  # Dependabot bump docker/Dockerfile to the new "<ver>-apache" tag, push the
  # operator release tag, then update DefaultZkContainerVersion.
  # Only the debian base image is automated here.
  - package-ecosystem: "docker"
    directory: "/docker/zookeeper-image"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "*zookeeper*"
    groups:
      zookeeper-image-dependencies:
        patterns:
          - "*"

  # Gradle dependencies for the "zu" helper tool (grouped into single PR)
  - package-ecosystem: "gradle"
    directory: "/docker/zu"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # See the note above: the ZooKeeper version is managed manually.
      - dependency-name: "org.apache.zookeeper:*"
    groups:
      gradle-dependencies:
        patterns:
          - "*"


  # =============================================================================
  # GO MODULES CONFIGURATION WITH GROUPING
  # =============================================================================
  # Grouping combines all Go module updates into a single PR.
  # Groups apply per package-ecosystem entry.
  #
  # Current go.mod files detected:
  # - / (root)
  # =============================================================================

  # Main Go modules (grouped into single PR)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      main-go-dependencies:
        patterns:
          - "*"
