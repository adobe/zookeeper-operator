# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # GitHub Actions dependencies (grouped into single PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # Docker base images (grouped into single PR)
  # Every directory containing a Dockerfile must be listed explicitly:
  # Dependabot does not search subdirectories.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/build"
      - "/docker"
      - "/docker/zookeeper-image"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # The Apache ZooKeeper version is managed manually: it is pinned in
      # several places that Dependabot cannot see (tarball download in
      # docker/zookeeper-image/Dockerfile, release.yml tags and
      # DefaultZkContainerVersion in api/v1beta1/zookeepercluster_types.go),
      # so a Dockerfile-only bump would leave the repository inconsistent.
      - dependency-name: "*zookeeper*"
    groups:
      docker-dependencies:
        patterns:
          - "*"

  # Gradle dependencies for the "zu" helper tool (grouped into single PR)
  - package-ecosystem: "gradle"
    directory: "/docker/zu"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # See the note above: the ZooKeeper version is managed manually.
      - dependency-name: "org.apache.zookeeper:*"
    groups:
      gradle-dependencies:
        patterns:
          - "*"


  # =============================================================================
  # GO MODULES CONFIGURATION WITH GROUPING
  # =============================================================================
  # Grouping combines all Go module updates into a single PR.
  # Groups apply per package-ecosystem entry.
  #
  # Current go.mod files detected:
  # - / (root)
  # =============================================================================

  # Main Go modules (grouped into single PR)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      main-go-dependencies:
        patterns:
          - "*"
