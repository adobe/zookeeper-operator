# Validate authenticated emergency builds only on explicitly reviewed refs.
name: zookeeper-images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per architecture: no QEMU emulation needed.
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve ZooKeeper version
        id: zk
        run: |
          zk_version="$(./scripts/zookeeper-version.sh)"
          echo "zk_version=${zk_version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - name: Check emergency JDK download configuration
        env:
          JAVA_DOWNLOAD_BASE_URL: ${{ secrets.JAVA_DOWNLOAD_BASE_URL }}
          JAVA_DOWNLOAD_APIKEY: ${{ secrets.JAVA_DOWNLOAD_APIKEY }}
        run: |
          : "${JAVA_DOWNLOAD_BASE_URL:?Set the approved JDK mirror repository secret}"
          : "${JAVA_DOWNLOAD_APIKEY:?Set the JDK mirror credential repository secret}"

      - name: Build Apache ZooKeeper base image
        uses: docker/build-push-action@v7
        with:
          context: docker/zookeeper-image
          platforms: linux/${{ matrix.arch }}
          secrets: |
            JAVA_DOWNLOAD_APIKEY=${{ secrets.JAVA_DOWNLOAD_APIKEY }}
          build-args: |
            ZK_VERSION=${{ steps.zk.outputs.zk_version }}
            java_version=21
            java_download_version=21.0.13.1
            java_download_base_url=${{ secrets.JAVA_DOWNLOAD_BASE_URL }}
          outputs: type=oci,dest=${{ runner.temp }}/zookeeper-apache,tar=false
          cache-from: type=gha,scope=zookeeper-apache-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=zookeeper-apache-{0}', matrix.arch) || '' }}

      # Same pairing as the release job: docker/Dockerfile is built FROM the
      # base image just built (via BASE_IMAGE), here resolved from the local
      # OCI layout through a named build context instead of a registry.
      - name: Build ZooKeeper image on top of the freshly built base
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=zookeeper-apache:ci
          build-contexts: |
            zookeeper-apache:ci=oci-layout://${{ runner.temp }}/zookeeper-apache
          tags: zookeeper:ci
          load: true
          cache-from: type=gha,scope=zookeeper-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=zookeeper-{0}', matrix.arch) || '' }}

      - name: Smoke test image
        env:
          ZK_VERSION: ${{ steps.zk.outputs.zk_version }}
        run: |
          docker run --rm --entrypoint bash -e ZK_VERSION zookeeper:ci -ec '
            java -version
            java -XshowSettings:properties -version 2>&1 | grep -Eq "^[[:space:]]*java.specification.version = ${JAVA_VERSION}$"
            zkServer.sh version 2>/dev/null | tee /dev/stderr | grep -q "${ZK_VERSION}"
            test -s /opt/libs/zu.jar
            set +e
            zu_output="$(java -jar /opt/libs/zu.jar 2>&1)"
            zu_status=$?
            set -e
            printf "%s\n" "$zu_output"
            test "$zu_status" -eq 1
            grep -q "^Usage: zu " <<<"$zu_output"
            for s in zookeeperStart.sh zookeeperReady.sh zookeeperLive.sh zookeeperTeardown.sh zookeeperMetrics.sh; do
              test -x "/usr/local/bin/${s}"
            done
            command -v dig curl socat pgrep >/dev/null
          '
      - name: Verify patched JVM in the running ZooKeeper process
        run: |
          docker run --rm --entrypoint bash \
            -v "${PWD}/scripts/test-zookeeper-image.sh:/test-zookeeper-image.sh:ro" \
            zookeeper:ci /test-zookeeper-image.sh
