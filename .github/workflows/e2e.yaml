# End-to-end tests against a kind cluster. The operator is built from this
# commit, loaded directly into kind and deployed in-cluster: running it
# in the test process (RUN_LOCAL=true) cannot work, because the reconciler
# connects to ZooKeeper through cluster DNS (*.svc.cluster.local), which does
# not resolve on the runner. The suite takes a long time, so it runs on
# demand, weekly, and on pull requests labelled "e2e".
name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (Kubernetes ${{ matrix.kubernetes }})
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.34"
            node_image: kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48
          - kubernetes: "1.35"
            node_image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    env:
      KIND_CLUSTER_NAME: zookeeper-e2e-${{ matrix.kubernetes }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install kind
        run: |
          GOBIN="${PWD}/bin" go install sigs.k8s.io/kind@v0.31.0
          echo "KUBECONFIG=${RUNNER_TEMP}/${KIND_CLUSTER_NAME}.kubeconfig" >> "$GITHUB_ENV"
      - name: Create kind cluster
        env:
          NODE_IMAGE: ${{ matrix.node_image }}
        run: bin/kind create cluster --name "$KIND_CLUSTER_NAME" --image "$NODE_IMAGE" --kubeconfig "$KUBECONFIG" --wait 120s
      # Pre-install kustomize into ./bin with the Makefile's version instead of
      # the install script, which trips GitHub's unauthenticated API rate limit.
      # Its compiler requirement can be newer than the operator's Go version.
      - name: Install kustomize
        run: |
          version="$(sed -n 's/^KUSTOMIZE_VERSION ?= //p' Makefile)"
          GOTOOLCHAIN=auto GOBIN="${PWD}/bin" go install "sigs.k8s.io/kustomize/kustomize/v5@${version}"
      - name: Build and load operator image
        env:
          IMAGE: zookeeper-operator:e2e
        run: |
          docker build \
            --build-arg VERSION=0.0.0-e2e \
            --build-arg GIT_SHA="${GITHUB_SHA::7}" \
            --build-arg GO_VERSION="$(awk '/^go /{print $2}' go.mod | cut -d. -f1,2)" \
            -t "$IMAGE" .
          bin/kind load docker-image --name "$KIND_CLUSTER_NAME" "$IMAGE"
      # Test the ZooKeeper image from this commit too: the default image in
      # the operator can predate script changes (e.g. the Logback config).
      - name: Build and load ZooKeeper image
        env:
          IMAGE: zookeeper:e2e
        run: |
          zk_version="$(./scripts/zookeeper-version.sh)"
          docker build --build-arg ZK_VERSION="$zk_version" -t zookeeper-apache:e2e docker/zookeeper-image
          docker build --build-arg BASE_IMAGE=zookeeper-apache:e2e -t "$IMAGE" docker
          bin/kind load docker-image --name "$KIND_CLUSTER_NAME" "$IMAGE"
      - name: Deploy operator
        run: |
          make manifests
          bin/kustomize build config/e2e | kubectl apply --server-side -f -
          kubectl rollout status deployment/zookeeper-operator --timeout=180s
      - name: Run e2e tests
        env:
          RUN_LOCAL: "false"
          ZK_IMAGE_REPOSITORY: zookeeper
          ZK_IMAGE_TAG: e2e
          ZK_IMAGE_PULL_POLICY: IfNotPresent
        run: go test -v -timeout 2h ./test/e2e/... -args -ginkgo.v
      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get all,pvc,events -A -o wide || true
          kubectl get zookeeperclusters -A -o yaml || true
          kubectl logs deployment/zookeeper-operator --tail=500 || true
      - name: Delete kind cluster
        if: always()
        run: bin/kind delete cluster --name "$KIND_CLUSTER_NAME" --kubeconfig "$KUBECONFIG"
