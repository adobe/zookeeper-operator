# End-to-end tests against a kind cluster. The operator is built from this
# commit, loaded directly into kind and deployed in-cluster: running it
# in the test process (RUN_LOCAL=true) cannot work, because the reconciler
# connects to ZooKeeper through cluster DNS (*.svc.cluster.local), which does
# not resolve on the runner. The suite takes a long time, so it runs on
# demand, weekly, and on pull requests labelled "e2e".
name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: build e2e images
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build operator image
        env:
          IMAGE: zookeeper-operator:e2e
        run: |
          docker build \
            --build-arg VERSION=0.0.0-e2e \
            --build-arg GIT_SHA="${GITHUB_SHA::7}" \
            --build-arg GO_VERSION="$(awk '/^go /{print $2}' go.mod | cut -d. -f1,2)" \
            -t "$IMAGE" .
      - name: Build ZooKeeper image
        env:
          IMAGE: zookeeper:e2e
        run: |
          set -o pipefail
          zk_version="$(./scripts/zookeeper-version.sh)"
          docker build --build-arg ZK_VERSION="$zk_version" -t zookeeper-apache:e2e docker/zookeeper-image
          build_log="$(mktemp)"
          trap 'rm -f "$build_log"' EXIT
          for attempt in 1 2 3; do
            status=0
            docker build --build-arg BASE_IMAGE=zookeeper-apache:e2e -t "$IMAGE" docker 2>&1 | tee "$build_log" || status=$?
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eq 'Received status code 429|429 Too Many Requests' "$build_log"; then
              exit "$status"
            fi
            sleep "$((attempt * 10))"
          done
      - name: Save runtime images
        run: |
          set -o pipefail
          docker image save zookeeper-operator:e2e zookeeper:e2e | gzip -1 > "${RUNNER_TEMP}/e2e-images.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-images
          path: ${{ runner.temp }}/e2e-images.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  e2e:
    name: e2e (Kubernetes ${{ matrix.kubernetes }})
    needs: images
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.34"
            node_image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    env:
      KIND_CLUSTER_NAME: zookeeper-e2e-${{ matrix.kubernetes }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install kind
        run: |
          version="$(awk '/^KIND_VERSION[[:space:]]*\?=/{print $3}' Makefile)"
          GOBIN="${PWD}/bin" go install "sigs.k8s.io/kind@${version}"
          echo "KUBECONFIG=${RUNNER_TEMP}/${KIND_CLUSTER_NAME}.kubeconfig" >> "$GITHUB_ENV"
      - name: Create kind cluster
        env:
          NODE_IMAGE: ${{ matrix.node_image }}
        run: bin/kind create cluster --name "$KIND_CLUSTER_NAME" --image "$NODE_IMAGE" --kubeconfig "$KUBECONFIG" --wait 120s
      # Pre-install kustomize into ./bin with the Makefile's version instead of
      # the install script, which trips GitHub's unauthenticated API rate limit.
      # Its compiler requirement can be newer than the operator's Go version.
      - name: Install kustomize
        run: |
          version="$(sed -n 's/^KUSTOMIZE_VERSION ?= //p' Makefile)"
          GOTOOLCHAIN=auto GOBIN="${PWD}/bin" go install "sigs.k8s.io/kustomize/kustomize/v5@${version}"
      - uses: actions/download-artifact@v8
        with:
          name: e2e-images
          path: ${{ runner.temp }}
      - name: Load source-built runtime images
        run: |
          docker image load --input "${RUNNER_TEMP}/e2e-images.tar.gz"
          bin/kind load docker-image --name "$KIND_CLUSTER_NAME" zookeeper-operator:e2e zookeeper:e2e
      - name: Deploy operator
        run: |
          make manifests
          bin/kustomize build config/e2e | kubectl apply --server-side -f -
          kubectl rollout status deployment/zookeeper-operator --timeout=180s
      - name: Run e2e tests
        env:
          RUN_LOCAL: "false"
          ZK_IMAGE_REPOSITORY: zookeeper
          ZK_IMAGE_TAG: e2e
          ZK_IMAGE_PULL_POLICY: IfNotPresent
        run: |
          set -o pipefail
          go test -v -timeout 2h ./test/e2e/... -args -ginkgo.v -ginkgo.slowSpecThreshold=0 2>&1 | tee "${RUNNER_TEMP}/e2e.log"
      - name: Upload e2e timings and output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output-${{ matrix.kubernetes }}
          path: ${{ runner.temp }}/e2e.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get all,pvc,events -A -o wide || true
          kubectl get zookeeperclusters -A -o yaml || true
          kubectl logs deployment/zookeeper-operator --tail=500 || true
      - name: Delete kind cluster
        if: always()
        run: bin/kind delete cluster --name "$KIND_CLUSTER_NAME" --kubeconfig "$KUBECONFIG"
