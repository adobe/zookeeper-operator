# Release pipeline, triggered by publishing a GitHub release (any tag name):
# run the Go checks, then publish the Apache ZooKeeper base image, the
# ZooKeeper and operator images and the Helm chart for the release tag.
#
# Images and the chart are pushed by digest and signed keylessly with cosign.
# No build cache is used here, so a poisoned cache from another workflow can
# never end up in a published artifact.
name: release

on:
  release:
    types: [published]

# Never cancel a release half way through publishing images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  # GitHub Container Registry
  GHCR_REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  GHCR_IMAGE_NAME: ${{ github.repository }}
  # Docker Hub image names
  DOCKERHUB_ZK_IMAGE: adobe/zookeeper
  DOCKERHUB_OPERATOR_IMAGE: adobe/zookeeper-operator

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      built_at: ${{ steps.vars.outputs.built_at }}
      zk_version: ${{ steps.zk.outputs.zk_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate tag and derive release variables
        id: vars
        run: |
          tag="${GITHUB_REF_NAME}"
          # The tag ends up in image tags, the chart version and sed expressions.
          if ! [[ "$tag" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Unsupported tag name '${tag}'"
            exit 1
          fi
          {
            echo "tag=${tag}"
            echo "built_at=$(date --rfc-3339=date)"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve Apache ZooKeeper version
        id: zk
        run: |
          zk_version="$(sed -n 's/^ARG ZK_VERSION=//p' docker/zookeeper-image/Dockerfile)"
          if [ -z "$zk_version" ]; then
            echo "::error::Could not read ARG ZK_VERSION from docker/zookeeper-image/Dockerfile"
            exit 1
          fi
          echo "Apache ZooKeeper version: $zk_version"
          echo "zk_version=$zk_version" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-checks

  build-zookeeper:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [prepare, checks]
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Login to DockerHub Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log into GitHub Container Registry ${{ env.GHCR_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata for zookeeper Apache
        id: meta-zk-apache
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_ZK_IMAGE }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}/zookeeper
          tags: |
            type=raw,value=${{ needs.prepare.outputs.zk_version }}-apache-${{ needs.prepare.outputs.tag }}
            type=raw,value=${{ needs.prepare.outputs.zk_version }}-apache
          labels: |
            org.opencontainers.image.description=Apache Zookeeper ${{ needs.prepare.outputs.zk_version }} with OpenJDK 21
      # Rebuilt on every release, so it also picks up the latest JDK 21 patch
      # release and Debian security updates.
      - name: Build and push zookeeper Apache image
        id: build-zk-apache
        uses: docker/build-push-action@v7
        with:
          context: docker/zookeeper-image
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-zk-apache.outputs.tags }}
          labels: ${{ steps.meta-zk-apache.outputs.labels }}
          annotations: ${{ steps.meta-zk-apache.outputs.annotations }}
          provenance: mode=max
          sbom: true
          push: true
      - name: Sign zookeeper Apache image
        env:
          TAGS: ${{ steps.meta-zk-apache.outputs.tags }}
          DIGEST: ${{ steps.build-zk-apache.outputs.digest }}
        run: |
          # Sign once per repository (tags stripped), by digest.
          sed 's/:[^:/]*$//' <<<"$TAGS" | sort -u | while read -r image; do
            cosign sign --yes "${image}@${DIGEST}"
          done
      - name: Extract Docker metadata for zookeeper
        id: meta-zk
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_ZK_IMAGE }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}/zookeeper
          tags: |
            type=raw,value=${{ needs.prepare.outputs.zk_version }}-${{ needs.prepare.outputs.tag }}
          labels: |
            org.opencontainers.image.description=Apache Zookeeper image build with java-21
      - name: Build and push zookeeper image
        id: build-zk
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          # Pin by digest to the exact image pushed above.
          build-args: |
            BASE_IMAGE=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}/zookeeper@${{ steps.build-zk-apache.outputs.digest }}
          tags: ${{ steps.meta-zk.outputs.tags }}
          labels: ${{ steps.meta-zk.outputs.labels }}
          annotations: ${{ steps.meta-zk.outputs.annotations }}
          provenance: mode=max
          sbom: true
          push: true
      - name: Sign zookeeper image
        env:
          TAGS: ${{ steps.meta-zk.outputs.tags }}
          DIGEST: ${{ steps.build-zk.outputs.digest }}
        run: |
          # Sign once per repository (tags stripped), by digest.
          sed 's/:[^:/]*$//' <<<"$TAGS" | sort -u | while read -r image; do
            cosign sign --yes "${image}@${DIGEST}"
          done

  build-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [prepare, checks]
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Extract Go version from go.mod
        id: govars
        run: echo "go_version=$(awk '/^go /{print $2}' go.mod | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
      # No QEMU: the Dockerfile cross-compiles natively (BUILDPLATFORM + TARGETARCH)
      # and the distroless final stage has no RUN instructions.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Login to DockerHub Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log into GitHub Container Registry ${{ env.GHCR_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata for zookeeper-operator
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_OPERATOR_IMAGE }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
          tags: |
            type=ref,event=tag
          labels: |
            org.opencontainers.image.description=Zookeeper Operator for Kubernetes
      - name: Build and push zookeeper-operator image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            BUILT_AT=${{ needs.prepare.outputs.built_at }}
            GIT_SHA=${{ github.sha }}
            GO_VERSION=${{ steps.govars.outputs.go_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          push: true
      - name: Sign image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Sign once per repository (tags stripped), by digest.
          sed 's/:[^:/]*$//' <<<"$TAGS" | sort -u | while read -r image; do
            cosign sign --yes "${image}@${DIGEST}"
          done

  release-helm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare, build-zookeeper, build-operator]
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Log into GitHub Container Registry ${{ env.GHCR_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Chart.yaml and values.yaml versions
        run: |
          sed -i "s/^version:.*/version: \"${TAG}\"/" charts/zookeeper-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${TAG}\"/" charts/zookeeper-operator/Chart.yaml
          sed -i "/^image:/,/^[^ ]/ s/^  tag:.*/  tag: ${TAG}/" charts/zookeeper-operator/values.yaml
      - name: Package, push and sign Helm chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chart_repo="${GHCR_REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/helm-charts"
          printf '%s' "$GITHUB_TOKEN" | helm registry login "$GHCR_REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          helm package charts/zookeeper-operator --dependency-update --destination dist
          helm push "dist/zookeeper-operator-${TAG}.tgz" "oci://${chart_repo}" 2>&1 | tee push.log
          digest="$(awk '/^Digest:/{print $2}' push.log)"
          if [ -z "$digest" ]; then
            echo "::error::Could not determine the pushed chart digest"
            exit 1
          fi
          cosign sign --yes "${chart_repo}/zookeeper-operator@${digest}"
