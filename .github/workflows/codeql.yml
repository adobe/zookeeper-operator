name: "CodeQL"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '34 23 * * 4'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          # The zu helper in docker/zu is Kotlin, which requires a real build.
          - language: java # java-kotlin; kept as "java" so existing alerts keep their category
            build-mode: manual
          # Scans the GitHub Actions workflows themselves.
          - language: actions
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Go
      if: matrix.language == 'go'
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Set up JDK 21
      if: matrix.language == 'java'
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Build Go code
      if: matrix.language == 'go'
      run: go build ./...

    - name: Build zu (Kotlin)
      if: matrix.language == 'java'
      working-directory: docker/zu
      run: ./gradlew build --no-daemon

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
