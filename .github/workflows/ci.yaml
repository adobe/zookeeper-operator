name: ci

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-checks

  metadata:
    name: ZooKeeper metadata integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Retry-safe metadata with disposable ZooKeeper
        run: go test -tags=zkintegration ./pkg/zk -run '^TestMetadataCreate' -count=1 -timeout=4m -v

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          # The existing code base still carries legacy findings; only report
          # issues introduced by the change under review.
          only-new-issues: true

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install pinned Kustomize
        run: |
          version="$(sed -n 's/^KUSTOMIZE_VERSION ?= //p' Makefile)"
          GOBIN="${PWD}/bin" go install "sigs.k8s.io/kustomize/kustomize/v5@${version}"
      - name: Manifest contracts
        run: go test -tags=manifests ./test/manifests -count=1
      - name: Check values schema json
        uses: losisin/helm-values-schema-json-action@v3
        with:
          values: values.yaml
          working-directory: charts/zookeeper-operator
          fail-on-diff: true
      - name: helm lint
        run: helm lint --strict charts/zookeeper-operator
      - name: Validate rendered manifests with kubeconform
        run: |
          # kubeconform has no built-in CustomResourceDefinition schema.
          # This explicit exception does not validate the ZooKeeper custom-resource schema.
          versions="$(sed -n 's/.*node_image: kindest\/node:v\([0-9.]*\)@.*/\1/p' .github/workflows/e2e.yaml)"
          test -n "$versions"
          for version in $versions; do
            helm template zookeeper-operator charts/zookeeper-operator --kube-version "$version" \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
                  -kubernetes-version "$version" -strict -summary -skip CustomResourceDefinition
          done

  operator-image:
    name: operator image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Extract Go version from go.mod
        id: govars
        run: echo "go_version=$(awk '/^go /{print $2}' go.mod | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
      # The Dockerfile cross-compiles natively (BUILDPLATFORM + TARGETARCH), so
      # both platforms build without QEMU.
      - uses: docker/setup-buildx-action@v4
      - name: Build operator image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=0.0.0-ci
            GIT_SHA=${{ github.sha }}
            GO_VERSION=${{ steps.govars.outputs.go_version }}
          push: false
          cache-from: type=gha,scope=operator
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=operator' || '' }}
