apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../default
patches:
- target:
    kind: Deployment
    name: zookeeper-operator
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: zookeeper-operator
    spec:
      template:
        spec:
          containers:
          - name: zookeeper-operator
            image: zookeeper-operator:e2e
            imagePullPolicy: IfNotPresent
